<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cezalarım - Kullanıcı Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7fa;
            --text-main: #2d3748;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            color: #1a202c;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            border: 1px solid var(--border);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            padding: 1rem;
            font-weight: 600;
            color: #4a5568;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .amount {
            font-weight: 700;
            color: var(--danger);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-unpaid {
            background-color: #fef2f2;
            color: #991b1b;
        }

        .status-paid {
            background-color: #def7ec;
            color: #03543f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cezalarım</h1>
            <p>Geciken kitaplarınızdan kaynaklı oluşan cezalarınızı buradan görebilir ve ödeyebilirsiniz.</p>
        </div>
        
        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>İlgili Kitap</th>
                            <th>Oluşma Tarihi</th>
                            <th>Ceza Miktarı</th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Örnek satır (Thymeleaf ile doldurulacak) -->
                        <tr>
                            <td>1984</td>
                            <td>16.05.2026</td>
                            <td class="amount">10.00 ₺</td>
                            <td><span class="status-badge status-unpaid">Ödenmedi</span></td>
                            <td>
                                <button class="btn">Hemen Öde</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Dönüşüm</td>
                            <td>01.04.2026</td>
                            <td style="color: #03543f; font-weight: bold;">15.00 ₺</td>
                            <td><span class="status-badge status-paid">Ödendi</span></td>
                            <td>
                                <span style="color: #a0aec0; font-size: 0.875rem;">İşlem Yok</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
