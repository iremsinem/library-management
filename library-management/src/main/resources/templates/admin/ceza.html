<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceza İşlemleri - Admin Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e2e8f0;
            --row-hover: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin: 0;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.025);
            padding: 2rem;
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.025);
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background-color: var(--success-hover);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3), 0 2px 4px -2px rgba(16, 185, 129, 0.3);
        }

        .btn-success:disabled {
            background-color: #a7f3d0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
        }

        th {
            background-color: #f8fafc;
            padding: 1.25rem 1rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr {
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        tr:hover {
            background-color: var(--row-hover);
        }

        /* Checkbox Styling */
        .checkbox-cell {
            width: 40px;
            text-align: center;
        }

        .custom-checkbox {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .amount {
            font-weight: 700;
            color: var(--danger);
            font-variant-numeric: tabular-nums;
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .status-unpaid {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .status-paid {
            background-color: #d1fae5;
            color: #047857;
        }
        
        .description-cell {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
        }
        
        .selected-row {
            background-color: #eff6ff !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ceza İşlemleri</h1>
        </div>
        
        <div class="card">
            <div class="toolbar">
                <button id="btnNakitTahsilEt" class="btn btn-success" disabled>
                    <svg style="width: 1.25rem; height: 1.25rem; margin-right: 0.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Nakit Tahsil Et
                </button>
            </div>
            
            <div class="table-container">
                <table id="cezaTable">
                    <thead>
                        <tr>
                            <th class="checkbox-cell">
                                <input type="checkbox" id="selectAll" class="custom-checkbox">
                            </th>
                            <th>Ceza ID</th>
                            <th>Kullanıcı</th>
                            <th>Kitap (Geciken)</th>
                            <th>Gecikme Süresi</th>
                            <th>Ceza Miktarı</th>
                            <th>Açıklama</th>
                            <th>Durum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Örnek satırlar (Thymeleaf ile doldurulacak) -->
                        <tr>
                            <td class="checkbox-cell">
                                <input type="checkbox" class="custom-checkbox row-checkbox" value="502">
                            </td>
                            <td>#502</td>
                            <td>Ayşe Demir</td>
                            <td>Simyacı</td>
                            <td>5 Gün</td>
                            <td class="amount">25.00 ₺</td>
                            <td class="description-cell" title="Kitap 5 gün geç teslim edildi.">Kitap 5 gün geç teslim edildi.</td>
                            <td><span class="status-badge status-unpaid">Ödenmedi</span></td>
                            <td>
                                <button class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">İncele</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="checkbox-cell">
                                <input type="checkbox" class="custom-checkbox row-checkbox" value="503">
                            </td>
                            <td>#503</td>
                            <td>Mehmet Yılmaz</td>
                            <td>1984</td>
                            <td>2 Gün</td>
                            <td class="amount">10.00 ₺</td>
                            <td class="description-cell" title="Sistem tarafından otomatik eklendi.">Sistem tarafından otomatik eklendi.</td>
                            <td><span class="status-badge status-unpaid">Ödenmedi</span></td>
                            <td>
                                <button class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">İncele</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selectAll = document.getElementById('selectAll');
            const rowCheckboxes = document.querySelectorAll('.row-checkbox');
            const btnNakitTahsilEt = document.getElementById('btnNakitTahsilEt');
            const tableRows = document.querySelectorAll('tbody tr');

            function updateButtonState() {
                const anyChecked = Array.from(rowCheckboxes).some(cb => cb.checked);
                btnNakitTahsilEt.disabled = !anyChecked;
                
                // Update select all checkbox state
                if (rowCheckboxes.length > 0) {
                    const allChecked = Array.from(rowCheckboxes).every(cb => cb.checked);
                    const someChecked = Array.from(rowCheckboxes).some(cb => cb.checked);
                    selectAll.checked = allChecked;
                    selectAll.indeterminate = someChecked && !allChecked;
                }
            }

            // Select All logic
            if (selectAll) {
                selectAll.addEventListener('change', function() {
                    rowCheckboxes.forEach(cb => {
                        cb.checked = this.checked;
                        const row = cb.closest('tr');
                        if (this.checked) {
                            row.classList.add('selected-row');
                        } else {
                            row.classList.remove('selected-row');
                        }
                    });
                    updateButtonState();
                });
            }

            // Individual checkbox logic
            rowCheckboxes.forEach(cb => {
                cb.addEventListener('change', function(e) {
                    e.stopPropagation(); // Prevent row click from firing
                    const row = this.closest('tr');
                    if (this.checked) {
                        row.classList.add('selected-row');
                    } else {
                        row.classList.remove('selected-row');
                    }
                    updateButtonState();
                });
            });

            // Row click logic (clicking anywhere on the row toggles the checkbox)
            tableRows.forEach(row => {
                row.addEventListener('click', function(e) {
                    // Ignore if clicked on button or checkbox directly
                    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('.btn')) {
                        return;
                    }
                    
                    const checkbox = this.querySelector('.row-checkbox');
                    if (checkbox) {
                        checkbox.checked = !checkbox.checked;
                        if (checkbox.checked) {
                            this.classList.add('selected-row');
                        } else {
                            this.classList.remove('selected-row');
                        }
                        updateButtonState();
                    }
                });
            });

            // Tahsil Et Butonu click event
            if (btnNakitTahsilEt) {
                btnNakitTahsilEt.addEventListener('click', function() {
                    const selectedIds = Array.from(rowCheckboxes)
                        .filter(cb => cb.checked)
                        .map(cb => cb.value);
                    
                    if (selectedIds.length > 0) {
                        alert('Seçilen cezalar (' + selectedIds.join(', ') + ') tahsil ediliyor...');
                        // Burada backend'e AJAX isteği yapılabilir
                    }
                });
            }
        });
    </script>
</body>
</html>
